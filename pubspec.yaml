name: poly_mint
description: "PolyMint — AI-verified plastic recovery & circular-economy credit minting."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.5

  # Dependency injection
  get_it: ^9.2.1

  # AI / Camera / Sensors
  camera: ^0.10.5
  tflite_flutter: ^0.12.1
  image: ^4.1.3 # Used for precise image tensor reshaping
  geolocator: ^10.1.0

  # PoPP (Proof-of-Physical-Presence) stack
  flutter_blue_plus: ^1.32.12 # BLE link to the ESP32 load-cell
  crypto: ^3.0.3 # SHA-256 payload + perceptual-hash chaining

  # Backend
  cloud_firestore: ^4.13.6
  firebase_core: ^2.24.2

  # Local persistence & platform
  shared_preferences: ^2.5.3
  connectivity_plus: ^6.1.5
  path_provider: ^2.1.6

  # Utilities & UI
  intl: ^0.19.0
  uuid: ^4.5.1
  fl_chart: ^0.69.2

flutter:
  uses-material-design: true
  assets:
    - assets/best_float32.tflite
    - assets/labels.txt

  fonts:
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Variable.ttf
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^9.1.7
  flutter_lints: ^6.0.0
